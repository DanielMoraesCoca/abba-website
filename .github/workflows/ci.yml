name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Inclui a régua do revisor: número do índice proibido, vocabulário
      # banido e URL fora de abbaservices.com.br derrubam o build.
      - name: Testes unitários
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # Inclui a auditoria WCAG 2.2 AA em todas as onze páginas: contraste,
      # rótulo de campo, ordem de cabeçalho, marco sem nome. Violação
      # derruba o build.
      - name: Testes de ponta a ponta
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
