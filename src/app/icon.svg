<!-- O ícone da aba: a letra, não o símbolo.

     O que estava aqui era o grafo de doze nós e catorze arestas, que é o
     logo de cérebro aposentado em V5e. Ele sobreviveu à limpeza da capa e
     da constelação porque ninguém abre o favicon durante o trabalho, e era
     o lugar mais persistente de todos: uma aba aberta o mostra o dia
     inteiro, em toda página do site.

     A marca da ABBA é o nome, escrito, sem símbolo (briefing §4). Em 16
     pixels quatro letras não se leem, então fica a inicial, em serifa, na
     mesma relação de navy e ouro do resto do sistema.

     A pilha de fontes repete a do site: Newsreader não existe aqui dentro,
     e a Iowan Old Style e a Georgia são as mesmas reservas que o
     globals.css já declara para título. Qualquer substituição cai numa
     serifa de texto, que é o desenho certo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#101B31"/>
  <text
    x="32"
    y="46"
    text-anchor="middle"
    font-family="&quot;Iowan Old Style&quot;, Georgia, &quot;Times New Roman&quot;, serif"
    font-size="44"
    font-weight="400"
    fill="#C2A35B"
  >A</text>
</svg>
